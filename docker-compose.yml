version: "3.9"
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./services/sentinel_api
    env_file: ./services/sentinel_api/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata: