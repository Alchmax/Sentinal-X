services:
  - type: web
    name: sentinel-api
    runtime: python
    rootDir: services/sentinel_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinel-frontend.onrender.com
      - key: AI_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: sentinel-frontend
    runtime: static
    rootDir: apps/sentinel_flutter
    buildCommand: |
      curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.0-stable.tar.xz | tar -xJ -C /opt
      export PATH="/opt/flutter/bin:$PATH"
      flutter build web --dart-define=API_BASE_URL=https://sentinel-api.onrender.com
    staticPublishPath: build/web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel
    plan: free